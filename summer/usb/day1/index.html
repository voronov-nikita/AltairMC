<!DOCTYPE html>
<html lang="ru">
    <head>
        <meta charset="UTF-8" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
        />
        <title>USB Хаб</title>
        <link rel="icon" href="data:," />
        <link rel="stylesheet" href="styles.css" />
    </head>
    <body>
        <div class="container">
            <h1>Введите код</h1>
            <div class="code-inputs" id="codeInputs">
                <!-- Сюда будут добавлены инпуты через JS -->
            </div>
            <button id="checkButton" class="wide-button">Проверить</button>
        </div>

        <!-- Модальное окно для успешного ввода -->
        <div class="modal" id="successModal">
            <div class="modal-content">
                <div class="success-icon">✓</div>
                <h2>Молодец!</h2>
                <p id="successMessage">Код введен правильно!</p>
                <button id="closeModal">Закрыть</button>
            </div>
        </div>

        <script src="script.js"></script>
    </body>
</html>
